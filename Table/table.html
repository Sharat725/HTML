<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2" cellpadding="50" cellspacing="20" bgcolor="hotpink">
        <thead bgcolor="aqua">
            <tr>
                <td>ID</td>
                <td>NAME</td>
                <td>AGE</td>
            </tr>
        </thead>
        <tbody >
            <tr>
                <td>1</td>
                <td bgcolor="red">A</td>
                <td>20</td>
            </tr>
            <tr>
                <td>2</td>
                <td>B</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
