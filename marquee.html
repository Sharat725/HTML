<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee_example</title>
</head>
<body>
    <marquee behavior="" direction="" scrollamount="40" >Lorem ipsum dolor sit, amet consectetur adipisicing elit. Adipisci incidunt voluptas error alias ad porro soluta, corporis molestiae omnis cumque.</marquee>
    <marquee behavior="" direction="right"><img src="https://i.pinimg.com/originals/92/f4/f0/92f4f0dc507e3a051069aeaad81f0b49.gif" alt="" height="100px"><img src="https://cdnb.artstation.com/p/assets/images/images/039/153/939/original/kamilla-runner-0-07.gif?1625082705" alt="" height="100px"></marquee>
    <marquee behavior="" direction="up" height="500px" ><img src="https://cdn.dribbble.com/userupload/21393058/file/original-b445531b26557f048141adb639b466aa.gif" alt="" height="400px" ></marquee>
     <marquee behavior="" direction="down" height="500px" ><img src="https://cdn.dribbble.com/userupload/42368550/file/original-5401af6e102151955b2dc450d8843a71.gif" alt="" height="400px" ></marquee>
     <marquee behavior="alternate" direction="up" height="500px" scrollamount="60"><img src="https://i.pinimg.com/736x/90/54/47/9054477b03605cdea99c28d126a3eb35.jpg" alt="" height="100px"></marquee>
</body>
</html>
