<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <center>
        <h1>Registration form</h1>
        <form action="">
            <fieldset>
                <table>
                    <tr>
                        <td><label for="id">Id:</label></td>
                        <td><input type="text" id="id"></td>
                    </tr>
                    <tr>
                        <td><label for="name">Name:</label></td>
                        <td><input type="text" id="name"></td>
                    </tr>
                    <tr>
                        <td><label for="course">Course:</label></td>
                        <td><input type="text" id="course"></td>
                    </tr>
                    <tr>
                        <td><label for="branch">Branch:</label></td>
                        <td> <input type="text" id="branch"></td>
                    </tr>
                    <tr>
                        <td><label for="rno">Rollno:</label></td>
                        <td><input type="number" id="rno" > </td>
                    </tr>
                    <tr>
                        <td><label for="mail">Email_Address:</label></td>
                        <td><input type="text" id="mail"></td>
                    </tr>
                    <tr>
                        <td><label for="uname">User_Name:</label></td>
                        <td><input type="text" id="uname"> </td>
                    </tr>
                    <tr>
                        <td><label for="about">About Us:</label></td>
                        <td><textarea name="" id="about"></textarea></td>
                    </tr>
                    <tr>
                        <td> <label for="pass">Password:</label></td>
                        <td> <input type="text" id="pass"></td>
                    </tr>
                </table>
            <button>Add</button>
            </fieldset>

        </form>
    </center>
</body>
</html>
