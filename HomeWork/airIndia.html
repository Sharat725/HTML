<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air India</title>
</head>
<body>
    <form action="">
        <fieldset>
            <center><h1>Air India</h1></center><hr>
            <pre>Login                           SignUp                       Search                      Register</pre><hr>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRp8oed-o7UwydayaIy8I834HiCFcTfYREjQZe2eyVjFA&s=10" alt=""> <hr>
            <center>
                <table border="" cellspacing="0" cellpadding="15">
                <tr>
                    <th colspan="2">Book Ticket</th>
                    
                </tr>
                <tr>
                    <td>
                        <form action="">
                            <fieldset>
                                <legend>from</legend>
                                <input type="text" placeholder="from">
                            </fieldset>
                        </form>
                    </td>
                    <td>
                        <form action="">
                            <fieldset>
                                <legend>destination</legend>
                                <input type="text" placeholder="destination">
                            </fieldset>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>
                        <form action="">
                            <fieldset>
                                <legend>fromDate</legend>
                                <input type="date">
                            </fieldset>
                        </form>
                    </td>
                    <td>
                        <form action="">
                            <fieldset>
                                <legend>returnDate</legend>
                                <input type="date">
                            </fieldset>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <center><input type="radio" placeholder="from">Student <input type="radio">Adult <input type="radio"> Senior</center>
                        
                        
                    </td>
                    
                </tr>
                <tr>
                    <td colspan="2"><center><button>Submit</button></center></td>
                   
                </tr>
            </table>
            </center>
        </fieldset>
    </form>
    
</body>
</html>
