<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <center>
        <h1>Unorderd List</h1>
    </center>
    <hr>
    <!-- By default type = "desc -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cat</li>
    </ul>
    <ul type="square">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cat</li>
    </ul>
    <ul type="circle">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cat</li>
    </ul>
</body>
</html>
