<!DOCTYPE html>
<html lang="en">
<head>

    <title>Nested List </title>
</head>
<body>
    <center>
        <h1>
            Nested List
        </h1>
    </center>
    <hr>
    <ol>
        <li>Virat Kohli
            <!-- Bydefault unorderd list in nested list will display circle type
            -->
            <ul>
                <li>
                    Anuska Sharama
                    <ol>
                        <li>
                            Akaya
                        </li>
                        <li>
                            Vamika
                        </li>
                    </ol>
                </li>
                
            </ul>  
        </li>
        <li>Rohit Sharama</li>
        <li>KL Rahul</li>
    </ol>
</body>
</html>
